# PostgreSQL compartido del VPS (docs/vps/01-configuracion-vps.md, paso 8).
# En el VPS: /opt/vps/admin/postgres/compose.yml. La contraseña del superusuario vive solo en /srv/postgres/.env.
services:
  postgres:
    image: postgres:17
    container_name: postgres
    restart: unless-stopped
    env_file: /srv/postgres/.env
    volumes:
      - /srv/postgres/data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"   # solo para admins por túnel SSH; nunca 0.0.0.0
    networks: [infra]
    oom_score_adj: -800         # si falta memoria, Linux mata antes a cualquier app que a Postgres
    shm_size: 256m
    command: >
      postgres -c shared_buffers=384MB -c effective_cache_size=1GB
               -c work_mem=8MB -c maintenance_work_mem=128MB
               -c max_connections=100 -c log_min_duration_statement=1000
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 3s
      retries: 5
networks:
  infra:
    external: true

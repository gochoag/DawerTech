# Uptime Kuma (paso 10). En el VPS: /opt/vps/admin/monitoreo/compose.yml.
# Solo se abre por Tailscale: sudo tailscale serve --bg --https=8443 http://127.0.0.1:3001
services:
  kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    restart: unless-stopped
    volumes:
      - /srv/monitoreo/kuma:/app/data
    ports:
      - "127.0.0.1:3001:3001"   # nunca 0.0.0.0
    networks: [infra]           # para vigilar postgres:5432
networks:
  infra:
    external: true

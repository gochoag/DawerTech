[project]
name = "dawertech-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "Flask>=3.1,<4",
  "Flask-Cors>=5,<7",
  "SQLAlchemy>=2.0,<3",
  "alembic>=1.15,<2",
  "argon2-cffi>=23.1,<26",
  "PyJWT>=2.10,<3",
  "Pillow>=11,<13",
  "python-dotenv>=1.2.4",
  "openpyxl>=3.1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[dependency-groups]
dev = [
  "pytest>=8,<10",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dawertech*"]

[tool.setuptools.package-data]
dawertech = ["data/*.json", "data/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

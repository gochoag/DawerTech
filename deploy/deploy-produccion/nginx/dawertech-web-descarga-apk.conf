# Descarga del APK desde la web con progreso: dawer.cfd/download-apk la atiende la API (Flask).
# Lo instala el admin en /etc/nginx/vps-extra/ (el sitio web de dawertech incluye /etc/nginx/vps-extra/dawertech-web*.conf).
location = /download-apk {
    proxy_pass http://dawertech_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;    # el progreso llega al navegador mientras se descarga
    proxy_read_timeout 120s;
}

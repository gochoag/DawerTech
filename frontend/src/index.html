<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>DawerTech · Inventario</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F8F6EE">
  <link rel="icon" href="assets/dt-mark.svg" type="image/svg+xml">
  <script>
    (function() {
      try {
        var s = localStorage.getItem('dawertech-theme');
        if (s === 'dark') {
          document.documentElement.classList.add('dark');
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#101114');
        }
      } catch (e) {}
    })();
  </script>
</head>
<body class="bg-[#F8F6EE] text-black dark:bg-[#111215] dark:text-[#F9FAFB] font-sans antialiased selection:bg-[#FFE600] selection:text-black">
  <dt-root></dt-root>
</body>
</html>
